<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Nandu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-hearts" aria-hidden="true"></div>

    <main class="container">
      <section class="hero card">
        <p class="eyebrow">A little note for my favorite person</p>
        <h1>For Nandu</h1>
        <p class="message">
          Hey Nandu… I love youuuu, Nandu. I miss you so much. Your smile is my favorite thing,
          and I just wanted to say it again… I love youuuu ❤️
        </p>

      </section>

      <section class="game-section card">
        <div class="game-header">
          <div>
            <p class="eyebrow accent">Mini love game</p>
            <h2>Catch the Hearts</h2>
          </div>
          <div class="stats">
            <span>Score: <strong id="score">0</strong></span>
            <span>Time: <strong id="time">20</strong>s</span>
          </div>
        </div>

        <div id="gameArea" class="game-area" aria-label="Love game area">
          <button id="startGame" class="game-btn">Start the game</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
